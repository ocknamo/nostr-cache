# Publishes the demo site (and the embed bundle it serves) to GitHub Pages.
#
# The deployed directory is packages/demo-site/dist, which the demo-site build
# also copies the embed bundle into — so the SPA, `nostr-timeline.js` and the
# `/embed/` iframe page are all served from one origin, which is what makes the
# published embed snippets work.
#
# One-time setup: Settings → Pages → Source must be set to "GitHub Actions".

name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      # `--workspaces` runs in the order the root package.json lists them, not
      # in dependency order, so the two packages whose builds depend on each
      # other are named explicitly: demo-site's build copies timeline-embed's
      # dist into its own.
      - run: npm run build
      - run: npm run build:embed
      - run: npm run build:demo
      # lint-and-test.yml and e2e.yml run in parallel with this workflow, so
      # without a gate here a red build would still be published.
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
