<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Nostr Timeline (embed)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      body {
        padding: 8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!--
      iframe host page.

      It is deliberately just a loader for the same bundle the Web Component
      users get: `<nostr-timeline>` behaves identically here, because inside an
      iframe the emulator patches the iframe's own `globalThis` and leaves the
      embedding page untouched. There is no second code path to keep in sync.

      Configured through the query string, e.g.
        embed/?relays=wss://nos.lol&kinds=1&limit=20

      `filters` takes a URL-encoded JSON array of NIP-01 filters when the
      comma-separated attributes are not expressive enough, e.g.
        embed/?filters=%5B%7B%22kinds%22%3A%5B1%5D%2C%22limit%22%3A10%7D%5D

      For a follow timeline, use `embed/follow/?pubkey=npub1...` instead — that
      page mounts `<nostr-follow-timeline>`, which has no `authors` or `filters`.
    -->
    <script src="../nostr-timeline.js"></script>
    <script src="./embed-host.js"></script>
    <script>
      mountNostrEmbed('nostr-timeline', [
        'relays',
        'filters',
        'kinds',
        'authors',
        'limit',
        'db-name',
        'profile-freshness',
        // Configures the shared relay rather than this widget; see the element.
        'follows-freshness',
        'max-events',
        'debug',
        // Deprecated alias of `debug`; still forwarded so older embed URLs work.
        'show-origin',
        'show-avatars',
        'show-media',
        'show-embeds',
        // JSON array of buttons; embed-host.js reports a press to the parent.
        'actions',
        // Makes the avatar and display name pressable, reported the same way.
        'author-action',
        'author-action-label',
        // Makes the quote cards in a body pressable, reported the same way.
        'note-action',
        'note-action-label',
        // Material Symbols icons for those buttons, and where the font comes from.
        'material-icons',
        'material-icons-font',
      ]);
    </script>
  </body>
</html>
